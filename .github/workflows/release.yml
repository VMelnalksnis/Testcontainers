name: Release Paperless

on:
  push:
    tags: [ v*.*.** ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
        id-token: write
        contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-dotnet@v5.2.0
      - id: publish
        run: ./build/pack.sh "${{ github.ref_name }}" "${{ github.run_number }}"

      - name: NuGet Login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet Push
        run: dotnet nuget push "**/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
        working-directory: ${{ steps.publish.outputs.publish-directory }}

      - name: Create release
        uses: softprops/action-gh-release@v3.0.1
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.publish.outputs.publish-directory }}/**/*.nupkg
